name: Daily DC Sudoku Ingestion

on:
  schedule:
    # 09:05 IST, Monday through Saturday.
    # NOTE: GitHub evaluates cron in UTC only — a `timezone` key here is
    # NOT supported (silently ignored), which is why the old `35 8` entry
    # fired at 08:35 UTC = 14:05 IST instead of the intended morning slot.
    # 03:35 UTC == 09:05 IST year-round (IST has no DST), and Mon-Sat maps
    # 1:1 since 03:35 UTC is still the same weekday at +05:30. The job
    # itself stamps the IST date at runtime (TZ=Asia/Kolkata below).
    - cron: "35 3 * * 1-6"

  workflow_dispatch:
    inputs:
      date:
        description: "Date to process (YYYY-MM-DD). Leave empty for today."
        required: false
        type: string

permissions:
  contents: write
  issues: write

env:
  TZ: Asia/Kolkata

jobs:
  ingest:
    name: Detect, isolate and OCR DC Sudoku
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set processing date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE="$(TZ=Asia/Kolkata date +%F)"
          fi

          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE"
            exit 1
          fi

          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Processing date: $DATE (Asia/Kolkata)"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install OCR dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -n 1
          python -m pip install --upgrade "pip<25"
          pip install "requests<3" "numpy<2" "opencv-python" "pytesseract"
          python - <<'PY'
          import cv2
          import numpy
          import pytesseract
          print("OpenCV:", cv2.__version__)
          print("NumPy:", numpy.__version__)
          print("pytesseract:", pytesseract.__version__)
          print("Tesseract:", str(pytesseract.get_tesseract_version()).strip())
          PY

      # Detection is intentionally unchanged. It finds and saves the best
      # DC Sudoku source image as sudoku_source.jpg.
      - name: Detect DC Sudoku source image
        run: |
          python ingestion/dc_sudoku_detect.py \
            --date "${{ steps.date.outputs.date }}" \
            --page-min 1 \
            --page-max 20 \
            --variant-min 1 \
            --variant-max 10 \
            --workers 12 \
            --keep-all

      - name: Show detection result
        shell: bash
        run: |
          echo "=== Detection result ==="
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dc_test/${{ steps.date.outputs.date }}/detection.json")
          d = json.loads(p.read_text())
          b = d["best"]
          print(f"Selected: tabp{b['page']}_{b['variant']}.jpg")
          print(f"Size: {b['width']}x{b['height']}")
          print(f"Score: {b['final_score']:.2f}")
          print(f"Downloaded candidates: {d['downloaded']}")
          PY

      - name: Crop Sudoku images and run OCR (dynamic grid lines + vote + guided repair)
        shell: bash
        run: |
          python ingestion/dc_sudoku_pipeline.py \
            --date "${{ steps.date.outputs.date }}" \
            --source "dc_test/${{ steps.date.outputs.date }}/sudoku/sudoku_source.jpg" \
            --detection-json "dc_test/${{ steps.date.outputs.date }}/detection.json" \
            --vote-top 3

      - name: Copy cropped Sudoku images into frontend data
        shell: bash
        run: |
          DATE="${{ steps.date.outputs.date }}"
          mkdir -p "frontend/public/data/dc/$DATE"
          cp "dc_test/$DATE/sudoku/dc-1.jpg" "frontend/public/data/dc/$DATE/dc-1.jpg"
          cp "dc_test/$DATE/sudoku/dc-2.jpg" "frontend/public/data/dc/$DATE/dc-2.jpg"
          ls -lh "frontend/public/data/dc/$DATE/"

      - name: Show OCR and validation result
        shell: bash
        run: |
          echo "=== OCR / validation result ==="
          python - <<'PY'
          import json
          from pathlib import Path
          date = "${{ steps.date.outputs.date }}"
          d = json.loads((Path("dc_test") / date / "sudoku" / "ocr_result.json").read_text())
          for p in d["puzzles"]:
              clues = sum(1 for row in p["grid"] for v in row if v)
              vote = p["ocr"].get("vote") or {}
              print(f"--- {p['id']} verified={p['verified']} clues={clues} "
                    f"lines={p['ocr']['line_method']} repair={p['ocr'].get('repair') or 'none'} "
                    f"vote_srcs={len(vote.get('sources', []))} agree={vote.get('agreement')} "
                    f"guided_ok={p['ocr'].get('guided_ok')} guided={p['ocr'].get('guided_repair') or 'none'}")
              for row in p["grid"]:
                  print(" ".join(str(v) for v in row))
              print(f"validation={p['validation']}")
          PY
          ls -lh "dc_test/${{ steps.date.outputs.date }}/sudoku/"

      - name: Generate canonical daily JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          date = "${{ steps.date.outputs.date }}"
          root = Path("dc_test") / date / "sudoku"
          result = json.loads((root / "ocr_result.json").read_text())

          # The cropped newspaper image is the visual source of truth. OCR is
          # retained only as machine-readable data for solver interactions.
          canonical = {
              "date": result["date"],
              "edition": result["edition"],
              "source": result["source"],
              "puzzles": [
                  {
                      "id": p["id"],
                      "title": p["title"],
                      "verified": bool(p.get("verified", False)),
                      "image": p["image"],
                      "grid": p["grid"],
                  }
                  for p in result["puzzles"]
              ],
          }

          target = Path("frontend/public/data/today.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          text = json.dumps(canonical, indent=2) + "\n"
          target.write_text(text, encoding="utf-8")
          (root / "today.json").write_text(text, encoding="utf-8")

          print(f"Published canonical JSON for {date}")
          print("Cropped Sudoku images are the visual source of truth.")
          PY

      - name: Refuse to publish unverified garbage
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          d = json.loads(Path("frontend/public/data/today.json").read_text())
          good = [
              p for p in d["puzzles"]
              if p.get("verified")
              and 17 <= sum(1 for row in p["grid"] for v in row if v) <= 40
          ]
          print(f"Usable puzzles: {len(good)}/{len(d['puzzles'])}")
          if not good:
              print("No verified puzzle with 17-40 clues; refusing to publish.")
              print("Yesterday's data stays live instead of advert OCR noise.")
              sys.exit(1)
          PY

      - name: Open issue on ingestion failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.date.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/dc-issue.md
          import json
          import os
          from pathlib import Path
          date = os.environ.get("DATE") or "unknown-date"
          lines = [f"Daily DC ingestion failed for {date}.", ""]
          try:
              d = json.loads(Path(f"dc_test/{date}/detection.json").read_text())
              b = d.get("best", {})
              lines.append(
                  f"Detection: best=tabp{b.get('page')}_{b.get('variant')} "
                  f"final={b.get('final_score', 0):.1f} grid={b.get('grid_score', 0):.1f} "
                  f"eligible={d.get('eligible')} downloaded={d.get('downloaded')}"
              )
              for it in d.get("top50", [])[:5]:
                  lines.append(
                      f"  tabp{it.get('page')}_{it.get('variant')} "
                      f"final={it.get('final_score', 0):.1f} grid={it.get('grid_score', 0):.1f}"
                  )
          except Exception as e:
              lines.append(f"detection.json unreadable: {e}")
          lines.append("")
          try:
              o = json.loads(Path(f"dc_test/{date}/sudoku/ocr_result.json").read_text())
              for p in o["puzzles"]:
                  clues = sum(1 for row in p["grid"] for v in row if v)
                  lines.append(
                      f"{p['id']}: verified={p['verified']} clues={clues} "
                      f"repair={p['ocr'].get('repair') or 'none'} "
                      f"guided={p['ocr'].get('guided_repair') or 'none'} "
                      f"validation={p['validation']}"
                  )
          except Exception as e:
              lines.append(f"ocr_result.json unreadable: {e}")
          lines.append("")
          lines.append(f"Run: {os.environ.get('RUN_URL', '')}")
          lines.append(f"Full candidates: Actions artifact dc-sudoku-{date}.")
          print("\n".join(lines))
          PY
          cat /tmp/dc-issue.md
          gh issue create --title "DC ingestion failed for $DATE" --body-file /tmp/dc-issue.md || true

      - name: Commit daily Sudoku data and images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/today.json "frontend/public/data/dc/${{ steps.date.outputs.date }}"
          if git diff --cached --quiet; then
            echo "Daily Sudoku data is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "data: update DC Sudoku for ${{ steps.date.outputs.date }}"
          git push origin HEAD:main

      - name: Purge CDN cache for daily data
        continue-on-error: true
        shell: bash
        run: |
          DATE="${{ steps.date.outputs.date }}"
          for f in "frontend/public/data/today.json" "frontend/public/data/dc/$DATE/dc-1.jpg" "frontend/public/data/dc/$DATE/dc-2.jpg"; do
            curl -s -o /dev/null -w "purge $f: %{http_code}\n" \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f"
          done

      - name: Upload complete ingestion artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dc-sudoku-${{ steps.date.outputs.date }}
          path: dc_test/${{ steps.date.outputs.date }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload canonical daily JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dc-sudoku-json-${{ steps.date.outputs.date }}
          path: frontend/public/data/today.json
          if-no-files-found: error
          retention-days: 14

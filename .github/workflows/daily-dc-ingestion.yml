name: Daily DC Sudoku Ingestion

on:
  schedule:
    # 08:35 IST, Monday through Saturday.
    - cron: "35 8 * * 1-6"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      date:
        description: "Date to process (YYYY-MM-DD). Leave empty for today."
        required: false
        type: string

permissions:
  contents: write

env:
  TZ: Asia/Kolkata

jobs:
  ingest:
    name: Detect, isolate and OCR DC Sudoku
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set processing date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE="$(TZ=Asia/Kolkata date +%F)"
          fi

          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE"
            exit 1
          fi

          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Processing date: $DATE (Asia/Kolkata)"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install OCR dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version | head -n 1
          python -m pip install --upgrade "pip<25"
          pip install "requests<3" "numpy<2" "opencv-python" "pytesseract"
          python - <<'PY'
          import cv2
          import numpy
          import pytesseract
          print("OpenCV:", cv2.__version__)
          print("NumPy:", numpy.__version__)
          print("pytesseract:", pytesseract.__version__)
          PY

      # Detection is intentionally unchanged. It finds and saves the best
      # 729x600-ish DC Sudoku source image as sudoku_source.jpg.
      - name: Detect DC Sudoku source image
        run: |
          python ingestion/dc_sudoku_detect.py \
            --date "${{ steps.date.outputs.date }}" \
            --page-min 1 \
            --page-max 20 \
            --variant-min 1 \
            --variant-max 10 \
            --workers 12 \
            --keep-all

      - name: Show detection result
        shell: bash
        run: |
          echo "=== Detection result ==="
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dc_test/${{ steps.date.outputs.date }}/detection.json")
          d = json.loads(p.read_text())
          b = d["best"]
          print(f"Selected: tabp{b['page']}_{b['variant']}.jpg")
          print(f"Size: {b['width']}x{b['height']}")
          print(f"Score: {b['final_score']:.2f}")
          print(f"Downloaded candidates: {d['downloaded']}")
          PY

      - name: Crop Sudoku images and run best-effort cell OCR
        shell: bash
        run: |
          python ingestion/dc_sudoku_pipeline.py \
            --date "${{ steps.date.outputs.date }}" \
            --source "dc_test/${{ steps.date.outputs.date }}/sudoku/sudoku_source.jpg"

      - name: Copy cropped Sudoku images into frontend data
        shell: bash
        run: |
          DATE="${{ steps.date.outputs.date }}"
          mkdir -p "frontend/public/data/dc/$DATE"
          cp "dc_test/$DATE/sudoku/dc-1.jpg" "frontend/public/data/dc/$DATE/dc-1.jpg"
          cp "dc_test/$DATE/sudoku/dc-2.jpg" "frontend/public/data/dc/$DATE/dc-2.jpg"
          ls -lh "frontend/public/data/dc/$DATE/"

      - name: Show OCR and validation result
        shell: bash
        run: |
          echo "=== OCR / validation result ==="
          cat "dc_test/${{ steps.date.outputs.date }}/sudoku/ocr_result.json"

      - name: Generate canonical daily JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          date = "${{ steps.date.outputs.date }}"
          root = Path("dc_test") / date / "sudoku"
          result = json.loads((root / "ocr_result.json").read_text())

          # The cropped newspaper image is the visual source of truth. OCR is
          # retained only as machine-readable data for solver interactions.
          canonical = {
              "date": result["date"],
              "edition": result["edition"],
              "source": result["source"],
              "puzzles": [
                  {
                      "id": p["id"],
                      "title": p["title"],
                      "verified": bool(p.get("verified", False)),
                      "image": p["image"],
                      "grid": p["grid"],
                  }
                  for p in result["puzzles"]
              ],
          }

          target = Path("frontend/public/data/today.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          text = json.dumps(canonical, indent=2) + "\n"
          target.write_text(text, encoding="utf-8")
          (root / "today.json").write_text(text, encoding="utf-8")

          print(f"Published canonical JSON for {date}")
          print("Cropped Sudoku images are the visual source of truth.")
          PY

      - name: Commit daily Sudoku data and images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/today.json "frontend/public/data/dc/${{ steps.date.outputs.date }}"
          if git diff --cached --quiet; then
            echo "Daily Sudoku data is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "data: update DC Sudoku for ${{ steps.date.outputs.date }}"
          git push origin HEAD:main

      - name: Upload complete ingestion artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dc-sudoku-${{ steps.date.outputs.date }}
          path: dc_test/${{ steps.date.outputs.date }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload canonical daily JSON
        uses: actions/upload-artifact@v7
        with:
          name: dc-sudoku-json-${{ steps.date.outputs.date }}
          path: frontend/public/data/today.json
          if-no-files-found: error
          retention-days: 14

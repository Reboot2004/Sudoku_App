name: Daily DC Sudoku Ingestion

on:
  schedule:
    # 08:00 IST / 02:30 UTC, Monday through Saturday.
    - cron: "30 2 * * 1-6"

  workflow_dispatch:
    inputs:
      date:
        description: "Date to process (YYYY-MM-DD). Leave empty for today."
        required: false
        type: string

permissions:
  contents: write

jobs:
  ingest:
    name: Detect, crop, OCR and validate DC Sudoku
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set processing date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE="$(date -u +%F)"
          fi

          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE"
            exit 1
          fi

          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Processing date: $DATE"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system OCR dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version | head -n 1

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opencv-python-headless numpy pytesseract

      - name: Detect DC Sudoku source image
        run: |
          python ingestion/dc_sudoku_detect.py \
            --date "${{ steps.date.outputs.date }}" \
            --page-min 1 \
            --page-max 20 \
            --variant-min 1 \
            --variant-max 10 \
            --workers 12 \
            --keep-all

      - name: Show detection result
        shell: bash
        run: |
          echo "=== Detection result ==="
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dc_test/${{ steps.date.outputs.date }}/detection.json")
          d = json.loads(p.read_text())
          b = d["best"]
          print(f"Selected: tabp{b['page']}_{b['variant']}.jpg")
          print(f"Size: {b['width']}x{b['height']}")
          print(f"Score: {b['final_score']:.2f}")
          print(f"Downloaded candidates: {d['downloaded']}")
          PY

      - name: Crop and OCR Sudoku 1 and Sudoku 2
        run: |
          python ingestion/dc_sudoku_pipeline.py \
            --date "${{ steps.date.outputs.date }}" \
            --source "dc_test/${{ steps.date.outputs.date }}/sudoku/sudoku_source.jpg"

      - name: Show OCR and validation result
        shell: bash
        run: |
          echo "=== OCR / validation result ==="
          cat "dc_test/${{ steps.date.outputs.date }}/sudoku/ocr_result.json"

      - name: Generate canonical daily JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          date = "${{ steps.date.outputs.date }}"
          root = Path("dc_test") / date / "sudoku"
          result = json.loads((root / "ocr_result.json").read_text())

          # Verification is retained as metadata, but it does not block
          # publication. The OCR result is the source of truth for today.json.
          canonical = {
              "date": result["date"],
              "edition": result["edition"],
              "source": result["source"],
              "puzzles": [
                  {
                      "id": p["id"],
                      "title": p["title"],
                      "verified": bool(p.get("verified", False)),
                      "grid": p["grid"],
                  }
                  for p in result["puzzles"]
              ],
          }

          target = Path("frontend/public/data/today.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          text = json.dumps(canonical, indent=2) + "\n"
          target.write_text(text, encoding="utf-8")
          (root / "today.json").write_text(text, encoding="utf-8")

          print(f"Published canonical JSON for {date}")
          print("Verification does not block publication.")
          PY

      - name: Commit canonical daily JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/today.json
          if git diff --cached --quiet; then
            echo "today.json is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "data: update DC Sudoku for ${{ steps.date.outputs.date }}"
          git push origin HEAD:main

      - name: Upload complete ingestion artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dc-sudoku-${{ steps.date.outputs.date }}
          path: dc_test/${{ steps.date.outputs.date }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload canonical daily JSON
        uses: actions/upload-artifact@v7
        with:
          name: dc-sudoku-json-${{ steps.date.outputs.date }}
          path: frontend/public/data/today.json
          if-no-files-found: error
          retention-days: 14

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DC Sudoku APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Install frontend dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/gradle-wrapper.properties', 'frontend/android/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Show APK information
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dc-sudoku-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_TITLE="$(git log -1 --pretty=%s)"
          RELEASE_NOTES="$(git log -1 --pretty=%B)"
          TAG="apk-${{ github.run_number }}"

          echo "Creating release: $TAG"
          echo "Title: $RELEASE_TITLE"
          echo "Notes:"
          printf '%s\n' "$RELEASE_NOTES"

          gh release create "$TAG" "$APK" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES"
